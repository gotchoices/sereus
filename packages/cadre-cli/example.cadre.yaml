# Example Cadre Node Configuration
# Copy this file to cadre.yaml and customize for your deployment

# Node identity (optional - generates a throwaway identity if not specified, so a node
# that must keep its peer id across restarts has to set this).
identity:
  # Path to the private key file: a libp2p protobuf-encoded private key, exactly as
  # written by 'cadre enroll create' (and by cadre-host's installer as identity.key).
  # This is the only accepted format — a file in any other shape fails startup with a
  # clear error rather than being guessed at. 'keyFile' is the only key this block
  # accepts; a retired or misspelled name fails startup too.
  keyFile: ./cadre-peer.key

# Control network connection
controlNetwork:
  # UUID of your party/control network
  partyId: "your-party-uuid-here"
  # Bootstrap nodes to connect to
  bootstrapNodes:
    - "/dns4/bootstrap.example.com/tcp/4001/p2p/12D3KooW..."
    - "/ip4/192.168.1.100/tcp/4001/p2p/12D3KooW..."

# Node profile: 'transaction' (mobile/edge) or 'storage' (server)
profile: storage

# Strand filtering (optional, defaults to 'all')
# Options: 'all', 'none', { sAppId: "..." }, { strandId: "..." }
strandFilter: all

# Node-local durable state: the trusted-owner anchor
# (trusted-owners.<partyId>.json) and the retained cold-start dial targets
# (bootstrap-peers.<partyId>.json). Defaults to the directory holding THIS file
# — set it explicitly whenever that directory is not writable by the node's
# user (the systemd unit ships CADRE_NODE_STATE_DIR=/var/lib/cadre for exactly
# that reason, since /etc/cadre is mounted read-only there).
# nodeState:
#   dir: /var/lib/cadre

# Storage configuration (for storage profile)
storage:
  type: file
  path: ./data
  quotaBytes: 10737418240  # 10 GB

# Network configuration (optional)
network:
  # Addresses to listen on. Do NOT name a relay here ("<relay addr>/p2p-circuit") —
  # that form is rejected at start; use relayAddrs below, which reserves the slot
  # once this node's control database is up.
  listenAddrs:
    - "/ip4/0.0.0.0/tcp/4001"
    - "/ip6/::/tcp/4001"
  # Extra addresses to announce (if behind NAT/proxy), ADDED to the ones above. This
  # is the usual choice: the node stays reachable at its other addresses too.
  # appendAnnounceAddrs:
  #   - "/dns4/mynode.example.com/tcp/4001"
  # Addresses to announce INSTEAD OF the ones above. A non-empty value REPLACES
  # everything this node advertises — including the "/p2p-circuit" address a relayAddrs
  # reservation earns it, so peers stop reaching this node through its relay (the node
  # warns at start when both are set). Prefer appendAnnounceAddrs unless you mean that.
  # announceAddrs:
  #   - "/dns4/mynode.example.com/tcp/4001"
  # Circuit-relay servers to reserve a slot on, so peers can reach this node from
  # behind NAT. Give each relay's direct dial address ending in its peerId. The node
  # listens on a bare "/p2p-circuit" alongside listenAddrs and asks the relay for a
  # slot at the end of startup, once its control database is up. A relay named here
  # also relays for this node's strand nodes. A malformed entry fails startup rather
  # than being silently ignored, and so does a relay that grants no reservation.
  # relayAddrs:
  #   - "/dns4/relay.example.com/tcp/4001/p2p/12D3KooW..."
  # Enable circuit relay server - allows this node to relay connections for other peers.
  # Defaults to true for storage profile nodes, false for transaction profile.
  # enableRelay: true

# Hibernation settings
hibernation:
  enabled: true
  defaultLatencyHint: interactive  # realtime, interactive, background, archive

# Strand watcher polling interval (ms)
strandWatchInterval: 5000

