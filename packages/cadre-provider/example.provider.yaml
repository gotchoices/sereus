# Cadre Provider Configuration Example
# Copy this file and customize for your deployment
#
# Every key is checked when the provider starts: an unknown key or a value of the
# wrong type stops it with an error naming the key (see README → Configuration).

# API Server Configuration
server:
  host: 0.0.0.0
  port: 3000
  basePath: /api/v1
  cors:
    origin: true
    credentials: true

# Authentication Configuration
auth:
  # Options: none (dev only), api-key, oauth
  mode: api-key
  # For api-key mode: SHA-256 hashes of valid API keys
  # Generate with: echo -n "your-api-key" | sha256sum
  # apiKeyHashes:
  #   - abc123...
  
  # For oauth mode with your own identity provider (validateJwt hook):
  # jwksUri: https://your-auth-provider.com/.well-known/jwks.json
  # issuer: https://your-auth-provider.com
  # audience: cadre-provider-api
  #
  # For oauth mode with the built-in sign-in endpoints (README → Sign-in from apps):
  # apps register here, and your account system resolves the customer through the
  # authorizeCustomer hook. Allowed only with mode: oauth.
  # oauth:
  #   clients:
  #     - clientId: sereus-chat
  #       redirectUris: ["sereus-chat://provider-auth", "sereus-chat-second://provider-auth"]
  #       scopes: ["containers:*", "billing:read"]   # the most a token for this client may carry
  #   accessTokenTtlSec: 3600       # default
  #   refreshTokenTtlSec: 2592000   # default, 30 days
  #   # true serves the built-in consent form instead of the hook: anyone can sign in as any
  #   # customer id, so it needs allowInsecureNoAuth: true, like mode: none.
  #   devConsentPage: false

# Docker Orchestrator Configuration
docker:
  # Docker socket path
  socketPath: /var/run/docker.sock
  
  # Network for cadre containers
  network: sereus_provider
  
  # Image for cadre nodes
  image: sereus-cadre-node:latest
  
  # Image pull policy: always, if-not-present, never
  pullPolicy: if-not-present
  
  # Default resource limits for new containers
  defaultResources:
    memoryLimit: 512M
    cpuLimit: "0.5"
    storageQuotaBytes: 10737418240  # 10 GB
  
  # Port range for container allocation (four host ports per container)
  portRange:
    start: 10000
    end: 20000

  # DNS name or IP address at which the published container ports are reachable
  # from outside. Set it so phones can dial containers; POST /containers then
  # accepts join.kind "claim" as well as "invitation".
  # publicHost: provider.example.com

# Billing Configuration
billing:
  enabled: false
  
  # Stripe integration (optional)
  # stripeSecretKey: sk_test_...
  # stripeWebhookSecret: whsec_...
  
  # Default plan for new customers
  defaultPlanId: starter
  
  # Usage collection interval (seconds)
  usageCollectionIntervalSec: 60

# Storage Configuration
storage:
  # Options: memory (testing), file (production)
  type: file
  path: /data/provider

# Logging Configuration
logging:
  # Options: debug, info, warn, error
  level: info

# What GET /descriptor says about this provider: the document an app's store screen
# renders (README → Provider descriptor). Without this block the route answers 404.
provider:
  # Stable identifier an app keys its rental records by; never change it once published.
  id: acme-nodes
  name: Acme Cadre Nodes
  # The origin this API is reached at; every descriptor URL is this plus server.basePath.
  # https, except at a loopback host for a dev run (http://127.0.0.1:3000).
  publicUrl: https://nodes.acme.example
  # termsUrl: https://acme.example/terms
  # regions: ["eu-west"]
  # icon: https://acme.example/icon.png

