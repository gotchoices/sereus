appId: ${MAESTRO_APP_ID}
---
# Shared bootstrap for all e2e flows.
# Launches the phone app fresh, answers the first-launch question "Do you already
# use Sereus apps?" with Yes, joins the drone's cadre by redeeming its invitation
# (the app never founds a cadre of its own), creates a chat strand, and switches
# to the Chat tab.
#
# Env vars (injected by scripts/run-e2e.mjs):
#   CADRE_INVITATION         — drone's cadre invitation (pins the drone owner key
#                              and admits the phone at the drone as an owner, so
#                              the phone trusts what it then syncs and can found
#                              a strand)
#   STRAND_ID                — drone's pre-created strand
#   SIDECAR_URL              — drone HTTP base URL
#   MAESTRO_APP_ID           — phone app bundle id
#
# Outputs (for caller flows):
#   WORKING_STRAND_ID — the phone-created strand the drone has joined
#                       (use this for drone-side message inserts so phone
#                       and drone reference the same strand in chat tests)

- launchApp:
    clearState: true

# Settings tab.
- tapOn: "Settings"

# ── Join the drone's cadre on first launch ─────────────────────────────────
# A fresh install has no saved start, so the Node card asks before founding.
- extendedWaitUntil:
    visible:
      id: "btn-first-launch-join"
    timeout: 15000
- tapOn:
    id: "btn-first-launch-join"
# "Join my existing cadre" sits below the Node card, and its own request (a QR
# code) sits above the field, which can put the field below the fold.
- scrollUntilVisible:
    element:
      id: "input-cadre-invitation"
    direction: DOWN
- tapOn:
    id: "input-cadre-invitation"
- inputText: ${CADRE_INVITATION}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-join-cadre"
    direction: DOWN
- tapOn:
    id: "btn-join-cadre"
# The join starts a node in the drone's party (the build's default relay and
# encryption), dials the drone, waits for its answer and wires the phone's owner
# key. No cadre of the app's own exists, so nothing moves and nothing is removed.
# The connected sections come back above the join section when it is done, which
# can push the done line below the fold.
- scrollUntilVisible:
    element:
      id: "btn-join-flow-ok"
    direction: DOWN
    timeout: 120000
- assertVisible:
    id: "text-join-flow"
    text: "This app is now part of your cadre.*"
- tapOn:
    id: "btn-join-flow-ok"

# ── Create strand ─────────────────────────────────────────────────────────
# The connected sections appeared above the join section, so the button may
# not be on screen.
- scrollUntilVisible:
    element:
      id: "btn-create-strand"
    direction: DOWN
- tapOn:
    id: "btn-create-strand"
- assertVisible:
    id: "modal-title"
    text: "Strand created"
- tapOn:
    id: "btn-modal-ok"

# Wait for the phone status bar to reflect the new strand.
- extendedWaitUntil:
    visible:
      id: "status-bar"
      text: "Connected.*strand"
    timeout: 10000

# ── Discover the strand the drone joined ──────────────────────────────────
# The phone-created strand syncs to the drone via control network +
# strandFilter:all. Poll /status until the drone reports it.
- runScript: _helpers/discover-phone-strand.js

# ── Switch to Chat tab ────────────────────────────────────────────────────
- tapOn: "Chat"
- assertVisible:
    id: "status-bar"

# ── Determinism guard ─────────────────────────────────────────────────────
# Fail loudly here if the chat is NOT showing the discovered working strand.
# Without this, a non-deterministic active strand would let flows 2/3 pass
# vacuously (phone and drone silently referencing different strands). The
# strand-label element renders the FULL active strand id as visible text.
- assertVisible:
    id: "chat-strand-label"
    text: ${WORKING_STRAND_ID}
