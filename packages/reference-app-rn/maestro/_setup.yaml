appId: ${MAESTRO_APP_ID}
---
# Shared bootstrap for all e2e flows.
# Launches the phone app, connects to the drone fixture, joins the drone's cadre
# by redeeming its invitation, creates a chat strand, and switches to the Chat tab.
#
# Env vars (injected by scripts/run-e2e.mjs):
#   PARTY_ID, BOOTSTRAP_ADDR — from test-data.json
#   CADRE_INVITATION         — drone's cadre invitation (pins the drone owner key
#                              and admits the phone at the drone, so the cold
#                              phone trusts what it then syncs)
#   STRAND_ID                — drone's pre-created strand
#   SIDECAR_URL              — drone HTTP base URL
#   MAESTRO_APP_ID           — phone app bundle id
#
# Outputs (for caller flows):
#   WORKING_STRAND_ID — the phone-created strand the drone has joined
#                       (use this for drone-side message inserts so phone
#                       and drone reference the same strand in chat tests)

- launchApp:
    clearState: true

# Settings tab.
- tapOn: "Settings"

# ── Connect ───────────────────────────────────────────────────────────────
- tapOn:
    id: "input-party-id"
- inputText: ${PARTY_ID}
- hideKeyboard
- tapOn:
    id: "input-bootstrap-addr"
- inputText: ${BOOTSTRAP_ADDR}
- hideKeyboard
# The Relay field, the Connection encryption choice and their captions sit between
# the bootstrap field and this button, which can put it below the fold on a short
# screen. Scrolling to an element already on screen does nothing.
- scrollUntilVisible:
    element:
      id: "btn-connect"
    direction: DOWN
- tapOn:
    id: "btn-connect"
- extendedWaitUntil:
    visible:
      id: "btn-disconnect"
    timeout: 15000

# ── Join the cadre ────────────────────────────────────────────────────────
# The Join section sits below Seed Bootstrap, which can put it below the fold.
- scrollUntilVisible:
    element:
      id: "input-cadre-invitation"
    direction: DOWN
- tapOn:
    id: "input-cadre-invitation"
- inputText: ${CADRE_INVITATION}
- hideKeyboard
- tapOn:
    id: "btn-join-cadre"
# The join dials the drone and waits for its answer.
- extendedWaitUntil:
    visible:
      id: "modal-title"
      text: "Joined cadre"
    timeout: 15000
- tapOn:
    id: "btn-modal-ok"

# ── Create strand ─────────────────────────────────────────────────────────
- tapOn:
    id: "btn-create-strand"
- assertVisible:
    id: "modal-title"
    text: "Strand created"
- tapOn:
    id: "btn-modal-ok"

# Wait for the phone status bar to reflect the new strand.
- extendedWaitUntil:
    visible:
      id: "status-bar"
      text: "Connected.*strand"
    timeout: 10000

# ── Discover the strand the drone joined ──────────────────────────────────
# The phone-created strand syncs to the drone via control network +
# strandFilter:all. Poll /status until the drone reports it.
- runScript: _helpers/discover-phone-strand.js

# ── Switch to Chat tab ────────────────────────────────────────────────────
- tapOn: "Chat"
- assertVisible:
    id: "status-bar"

# ── Determinism guard ─────────────────────────────────────────────────────
# Fail loudly here if the chat is NOT showing the discovered working strand.
# Without this, a non-deterministic active strand would let flows 2/3 pass
# vacuously (phone and drone silently referencing different strands). The
# strand-label element renders the FULL active strand id as visible text.
- assertVisible:
    id: "chat-strand-label"
    text: ${WORKING_STRAND_ID}
