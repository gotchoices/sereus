appId: ${MAESTRO_APP_ID}
---
# Shared bootstrap for all e2e flows.
# Launches the phone app, connects with blank fields (founding its own cadre, as
# a fresh install does), joins the drone's cadre under "Join my existing cadre"
# by redeeming its invitation (which switches the app to the drone's party and
# removes the cadre it founded), creates a chat strand, and switches to the Chat
# tab.
#
# Env vars (injected by scripts/run-e2e.mjs):
#   CADRE_INVITATION         — drone's cadre invitation (pins the drone owner key
#                              and admits the phone at the drone as an owner, so
#                              the phone trusts what it then syncs and can found
#                              a strand)
#   STRAND_ID                — drone's pre-created strand
#   SIDECAR_URL              — drone HTTP base URL
#   MAESTRO_APP_ID           — phone app bundle id
#
# Outputs (for caller flows):
#   WORKING_STRAND_ID — the phone-created strand the drone has joined
#                       (use this for drone-side message inserts so phone
#                       and drone reference the same strand in chat tests)

- launchApp:
    clearState: true

# Settings tab.
- tapOn: "Settings"

# ── Connect ───────────────────────────────────────────────────────────────
# Party ID and Bootstrap addr stay blank: the phone founds a cadre of its own.
# The Relay field, the Connection encryption choice and their captions sit between
# the bootstrap field and this button, which can put it below the fold on a short
# screen. Scrolling to an element already on screen does nothing.
- scrollUntilVisible:
    element:
      id: "btn-connect"
    direction: DOWN
- tapOn:
    id: "btn-connect"
- extendedWaitUntil:
    visible:
      id: "btn-disconnect"
    timeout: 15000

# ── Join the cadre ────────────────────────────────────────────────────────
# "Join my existing cadre" sits below Seed Bootstrap, and its own request (a QR
# code) sits above the field, which can put the field below the fold.
- scrollUntilVisible:
    element:
      id: "input-cadre-invitation"
    direction: DOWN
- tapOn:
    id: "input-cadre-invitation"
- inputText: ${CADRE_INVITATION}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-join-cadre"
    direction: DOWN
- tapOn:
    id: "btn-join-cadre"
# The join stops the phone's own node, starts one in the drone's party, dials the
# drone and waits for its answer, and wires the phone's owner key; then it
# removes the cadre the phone founded (it holds no chats, so nothing moves),
# which restarts the node once more. The connected sections come back above the
# join section when it is done, which can push the done line below the fold.
- scrollUntilVisible:
    element:
      id: "btn-join-flow-ok"
    direction: DOWN
    timeout: 120000
- assertVisible:
    id: "text-join-flow"
    text: "This app is now part of your cadre.*"
- tapOn:
    id: "btn-join-flow-ok"

# ── Create strand ─────────────────────────────────────────────────────────
# The connected sections were hidden while the node switched party, so the
# button may no longer be on screen.
- scrollUntilVisible:
    element:
      id: "btn-create-strand"
    direction: DOWN
- tapOn:
    id: "btn-create-strand"
- assertVisible:
    id: "modal-title"
    text: "Strand created"
- tapOn:
    id: "btn-modal-ok"

# Wait for the phone status bar to reflect the new strand.
- extendedWaitUntil:
    visible:
      id: "status-bar"
      text: "Connected.*strand"
    timeout: 10000

# ── Discover the strand the drone joined ──────────────────────────────────
# The phone-created strand syncs to the drone via control network +
# strandFilter:all. Poll /status until the drone reports it.
- runScript: _helpers/discover-phone-strand.js

# ── Switch to Chat tab ────────────────────────────────────────────────────
- tapOn: "Chat"
- assertVisible:
    id: "status-bar"

# ── Determinism guard ─────────────────────────────────────────────────────
# Fail loudly here if the chat is NOT showing the discovered working strand.
# Without this, a non-deterministic active strand would let flows 2/3 pass
# vacuously (phone and drone silently referencing different strands). The
# strand-label element renders the FULL active strand id as visible text.
- assertVisible:
    id: "chat-strand-label"
    text: ${WORKING_STRAND_ID}
