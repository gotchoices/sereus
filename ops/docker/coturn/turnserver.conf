# Sereus coturn — base configuration TEMPLATE.
#
# This file is NOT consumed by coturn directly. `entrypoint.sh` renders it
# (substituting the ${...} placeholders from env.local) into the *active* config
# at /data/turnserver.active.conf, then conditionally APPENDS:
#   - an `external-ip=` line   (when EXTERNAL_IP is set)
#   - the TURN auth + relay block   (only when TURN_ENABLED=true)
#   - the TLS block   (only when TLS_CERT/TLS_KEY are provided)
#
# What lives here is the STUN-always-on baseline plus the abuse/SSRF controls
# that apply regardless of whether TURN is on. STUN needs no authentication, so
# a bare server with this config answers STUN Binding requests (the reflexive
# address discovery the WebRTC transport needs) but refuses TURN Allocate
# requests (no credential mechanism is configured) — i.e. STUN-only by default.

# --- Listeners -------------------------------------------------------------
# The UDP+TCP port clients send STUN Binding requests to (default 3478).
listening-port=${LISTENING_PORT}
# Interface coturn binds. 0.0.0.0 = all interfaces (the default).
listening-ip=${HOST_BIND_IP}

# Realm. Irrelevant for plain STUN, but coturn wants one set; defaults to the
# public hostname so logs/credentials are self-describing once TURN is enabled.
realm=${REALM}

# --- Integrity / hardening -------------------------------------------------
# Append a FINGERPRINT attribute to messages (RFC 5389) — standard for WebRTC.
fingerprint
# Expire nonces so a captured nonce can't be replayed indefinitely (TURN path).
stale-nonce=600

# Never expose the admin telnet CLI.
no-cli
# Drop legacy TLS even on the (optional) TLS listener.
no-tlsv1
no-tlsv1_1

# Logs to stdout so `./svc logs` / `docker logs` shows them.
log-file=stdout
simple-log

# --- Abuse / SSRF controls -------------------------------------------------
# These matter most once TURN relaying is enabled: a misconfigured TURN server
# is an open relay that can be pointed at the host's own private network. We
# deny multicast, loopback, and every non-public IPv4/IPv6 range, including
# IPv4-mapped and NAT64 prefixes, so a relayed peer can never reach internal
# services. STUN is unaffected (it never relays).
no-multicast-peers
no-loopback-peers

# IPv4 — special-use / private / reserved ranges (RFC 5735/6890, RFC 1918, CGNAT).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# IPv6 — loopback, unspecified, unique-local (fc00::/7), link-local (fe80::/10),
# IPv4-mapped (::ffff:0:0/96), and NAT64 well-known + local-use prefixes
# (64:ff9b::/96, 64:ff9b:1::/48 — RFC 6052/8215). Without these, a TURN client
# on a dual-stack socket can reach private IPv4 services via ::ffff:<private> or
# 64:ff9b::<private> even when all v4 literals are denied.
denied-peer-ip=::
denied-peer-ip=::1
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
