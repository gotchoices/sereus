# Yarn 4 defaults to Plug'n'Play, which breaks packages with native build steps
# and the stale-build guard's `node_modules` walk (test-harness/build-freshness.ts).
# The publish token is deliberately NOT here — see the README, "As a contributor".
nodeLinker: node-modules

# Package extensions for peer dependencies
packageExtensions:
  "react-native@*":
    peerDependencies:
      "@babel/core": "*"
      "@babel/runtime": "*"
  "@react-native-community/cli-platform-android@*":
    peerDependencies:
      "@react-native/gradle-plugin": "*"
